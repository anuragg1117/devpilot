# =========================================================
# Application
# =========================================================

spring.application.name=devpilot.backend

server.port=8080


# =========================================================
# PostgreSQL
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/devpilot

spring.datasource.username=${POSTGRES_USERNAME:devpilot}

spring.datasource.password=${POSTGRES_PASSWORD:devpilot}

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA
# =========================================================

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false


# =========================================================
# Flyway
# =========================================================

spring.flyway.enabled=true

spring.flyway.baseline-on-migrate=true

spring.flyway.locations=classpath:db/migration


# =========================================================
# GitHub OAuth2
# =========================================================

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}

spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

spring.security.oauth2.client.registration.github.scope=read:user,user:email,repo

spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}


# =========================================================
# GitHub Provider
# =========================================================

spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize

spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token

spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user

spring.security.oauth2.client.provider.github.user-name-attribute=id


# =========================================================
# GitHub API
# =========================================================

github.api.base-url=https://api.github.com


# =========================================================
# DevPilot Security
# =========================================================

app.token-encryptor-password=${CRYPTO_PASSWORD}

app.token-encryptor-salt=${CRYPTO_SALT}


# =========================================================
# Frontend
# =========================================================

app.frontend-url=http://localhost:5173

app.cors.allowed-origins=http://localhost:5173


# =========================================================
# Session
# =========================================================

server.servlet.session.cookie.name=DEVPILOT_SESSION

server.servlet.session.cookie.http-only=true

server.servlet.session.cookie.same-site=lax


# =========================================================
# Actuator
# =========================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=always


# =========================================================
# DevPilot Indexing
# =========================================================

devpilot.indexing.max-file-size=1000000

devpilot.indexing.chunk-size=1500

devpilot.indexing.chunk-overlap=200

devpilot.indexing.max-files=5000


# =========================================================
# Spring AI - Model Selection
# =========================================================

spring.ai.model.chat=openai

spring.ai.model.embedding=transformers

spring.ai.model.image=none

spring.ai.model.audio.speech=none

spring.ai.model.audio.transcription=none

spring.ai.model.moderation=none


# =========================================================
# Ollama Cloud - Chat / Reasoning
# =========================================================

spring.ai.openai.chat.base-url=https://ollama.com/v1

spring.ai.openai.chat.api-key=${OLLAMA_API_KEY}

spring.ai.openai.chat.options.model=${OLLAMA_CHAT_MODEL}


# =========================================================
# Java - Local Transformers Embeddings
# =========================================================

spring.ai.embedding.transformer.onnx.model-uri=https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx

spring.ai.embedding.transformer.tokenizer.uri=https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/raw/main/tokenizer.json

spring.ai.embedding.transformer.tokenizer.options.padding=true

spring.ai.embedding.transformer.cache.directory=./models/embeddings


# =========================================================
# PGVector
# =========================================================

spring.ai.vectorstore.pgvector.initialize-schema=true

spring.ai.vectorstore.pgvector.index-type=HNSW

spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE